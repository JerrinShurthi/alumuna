<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="eventGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2b48;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e4976;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#eventGrad)"/>
  <circle cx="500" cy="80" r="120" fill="rgba(255,255,255,0.04)"/>
  <circle cx="100" cy="280" r="160" fill="rgba(255,255,255,0.03)"/>
  <g transform="translate(250, 100)" fill="#fbbf24">
    <!-- Calendar icon -->
    <rect x="0" y="20" width="100" height="90" rx="12" fill="none" stroke="#fbbf24" stroke-width="8"/>
    <line x1="0" y1="50" x2="100" y2="50" stroke="#fbbf24" stroke-width="8"/>
    <line x1="25" y1="5" x2="25" y2="25" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <line x1="75" y1="5" x2="75" y2="25" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <circle cx="35" cy="75" r="6" fill="#fbbf24"/>
    <circle cx="65" cy="75" r="6" fill="#fbbf24"/>
    <circle cx="35" cy="95" r="6" fill="#fbbf24"/>
    <circle cx="65" cy="95" r="6" fill="#fbbf24"/>
  </g>
  <text x="300" y="250" font-family="Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">Campus &amp; Alumni Events</text>
  <text x="300" y="280" font-family="Segoe UI, sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">Networking, Reunions &amp; Professional Workshops</text>
</svg>
