<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Events | Admin Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="admin-layout">
    
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <img src="assets/images/logo.svg" alt="Admin Crest" class="sidebar-logo">
        <div>
          <div class="sidebar-brand-name">Alumni Portal</div>
          <span class="sidebar-role-badge">Administrator</span>
        </div>
      </div>

      <ul class="sidebar-menu">
        <li>
          <a href="admin-dashboard.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>Dashboard</span>
          </a>
        </li>
        <li>
          <a href="admin-alumni.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span>Alumni Management</span>
          </a>
        </li>
        <li>
          <a href="admin-events.html" class="active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span>Events Management</span>
          </a>
        </li>
        <li>
          <a href="admin-jobs.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
            </svg>
            <span>Jobs Management</span>
          </a>
        </li>
        <li>
          <a href="admin-announcements.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span>Announcements</span>
          </a>
        </li>
        <li>
          <a href="admin-feedback.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>Feedback &amp; Contact</span>
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <button id="admin-logout-btn" class="btn btn-outline-danger btn-block btn-sm">
          Logout
        </button>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" aria-label="Toggle Navigation">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <h1 class="topbar-title">Events Management</h1>
        </div>

        <div class="topbar-right">
          <div class="admin-user-pill">
            <div class="admin-avatar" id="admin-user-avatar">A</div>
            <span style="font-weight: 600; font-size: 0.88rem;" id="admin-user-name">Administrator</span>
          </div>
        </div>
      </header>

      <main class="admin-content">
        
        <div class="admin-action-bar">
          <div class="admin-search-box">
            <input type="text" id="admin-events-search" class="form-control" placeholder="Search events by title, venue, organizer...">
          </div>

          <div class="action-buttons">
            <span class="badge badge-primary" id="total-events-count" style="font-size: 0.85rem; padding: 0.6rem 0.85rem;">0 Events</span>
            <button type="button" id="open-add-event-btn" class="btn btn-primary">
              + Add Event
            </button>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>Banner</th>
                <th>Title</th>
                <th>Date</th>
                <th>Time</th>
                <th>Venue</th>
                <th>Organizer</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="admin-events-table-body">
              <tr><td colspan="7" class="text-center" style="padding: 2.5rem;">Loading events...</td></tr>
            </tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <!-- Add / Edit Event Modal -->
  <div class="modal-overlay" id="admin-event-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="event-modal-title">Add New Event</h3>
        <button type="button" class="modal-close-btn" id="close-event-modal">&times;</button>
      </div>

      <form id="admin-event-form">
        <input type="hidden" id="eventDocId" name="eventDocId" value="">
        <input type="hidden" id="existingImageUrl" name="existingImageUrl" value="">

        <div class="modal-body">
          <div class="form-group">
            <label for="event-title" class="form-label required">Event Title</label>
            <input type="text" id="event-title" name="title" class="form-control" placeholder="e.g. Annual Alumni Meet 2026" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="event-date" class="form-label required">Date</label>
              <input type="date" id="event-date" name="date" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="event-time" class="form-label required">Time</label>
              <input type="time" id="event-time" name="time" class="form-control" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="event-venue" class="form-label required">Venue / Location</label>
              <input type="text" id="event-venue" name="venue" class="form-control" placeholder="Auditorium A / Zoom Link" required>
            </div>
            <div class="form-group">
              <label for="event-organizer" class="form-label required">Organizer</label>
              <input type="text" id="event-organizer" name="organizer" class="form-control" placeholder="Alumni Affairs Office" required>
            </div>
          </div>

          <div class="form-group">
            <label for="event-description" class="form-label required">Event Description</label>
            <textarea id="event-description" name="description" class="form-control" rows="4" placeholder="Event schedule, key speakers, highlights..." required></textarea>
          </div>

          <div class="form-group">
            <label for="event-image-input" class="form-label">Banner Image (Optional)</label>
            <input type="file" id="event-image-input" accept="image/*" class="form-control" style="font-size: 0.85rem;">
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-event-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-event-btn">Save Event</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/utils.js"></script>
  <script type="module" src="js/admin-events.js"></script>
</body>
</html>
